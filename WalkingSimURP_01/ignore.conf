# Unity Version Control ignore rules for WalkingSimURP.
# Based on Unity's recommended template (docs.unity.com > Unity Version Control > Ignore files).
#
# Never ignore Assets, Packages or ProjectSettings: the project won't open without them.
# Unlike Unity's template, this file does NOT ignore itself. It is meant to be checked in
# so every PC that gets the project uses the same rules.

# Folders Unity regenerates on its own (Library alone is about 2 GB here)
Library
library
Temp
temp
Obj
obj
Build
build
Builds
builds
UserSettings
usersettings
MemoryCaptures
memorycaptures
Logs
logs

# Build output
*.apk

# Asset Store installer packages. The content is already imported into Assets, so these
# only cost upload time (about 356 MB in ForestLake). Delete this line to track them.
*.unitypackage

# Unity Version Control's own leftovers from merges
*.private
*.private.meta

# Gradle cache (Android builds)
.gradle

# IDE folders and generated project files: Unity rebuilds them on open
.vs
.idea
ExportedObj
.consulo
*.csproj
*.unityproj
*.sln
*.suo
*.tmp
*.user
*.userprefs
*.pidb
*.booproj
*.svd
*.pdb
*.mdb
*.opendb
*.VC.db
*.pidb.meta
*.pdb.meta
*.mdb.meta

# Crash reports and analytics files
sysinfo.txt
crashlytics-build.properties

# OS clutter
.DS_Store
Thumbs.db
Desktop.ini
